<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TVFlow AI Manager</title>
<style>
body{font:16px system-ui,sans-serif;background:#101725;color:#edf4fb;max-width:800px;padding:20px;margin:auto}
h1{color:#8ddafa}main{display:grid;gap:18px}section{background:#1b2739;border:1px solid #42536b;border-radius:14px;padding:20px}
input,button{font:inherit;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #66778b;border-radius:8px}
input{background:#0d1727;color:white;max-width:100%;width:100%}button{background:#386b9d;color:white;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #89d8fa}label{display:block}
#panel{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}#message{color:#f5de97}small{color:#acc0d4}
</style>
</head>
<body><main><header><h1>TVFlow AI Manager</h1><small>Administration privée des accès Groq pour TVFlow.</small></header>
<section id="login"><h2>Connexion administrateur</h2><label>Adresse e-mail<input id="email" type="email" autocomplete="username"></label>
<p>Un lien de connexion sera envoyé par e-mail. Aucun mot de passe nécessaire.</p>
<button type="button" id="loginBtn">Recevoir mon lien de connexion</button></section>
<section id="panel"><button id="logoutBtn">Se déconnecter</button>
<h2>Créer une invitation</h2><label>Validité (jours)<input id="days" type="number" min="1" max="30" value="7"></label>
<label>Quota quotidien<input id="limit" type="number" min="1" max="50" value="15"></label>
<button id="createBtn">Générer l'invitation</button>
<h2>Invitations existantes</h2><button id="listBtn">Actualiser</button><pre id="results"></pre>
<label>Identifiant de l'accès à révoquer<input id="revokeId"></label><button id="revokeBtn">Révoquer l'accès</button>
</section><p id="message" role="status" aria-live="polite"></p></main>
<script>
"use strict";
const origin="https://sxynniwybomzkguzomyn.supabase.co";
const api=origin+"/functions/v1/tvflow-ai-manager";
const apikey="sb_publishable_LT3gigSsz88JPmfUbY_ZnQ__89Mio6w";
let token="";
const el=id=>document.getElementById(id);
const show=x=>{el("message").textContent=x};
async function call(name,body={}){
 const r=await fetch(api+"/"+name,{method:"POST",headers:{"authorization":"Bearer "+token,"content-type":"application/json"},body:JSON.stringify(body)});
 const j=await r.json();if(!r.ok)throw Error(j.error||"Accès refusé");return j;
}
async function finishLogin(accessToken){
 token=accessToken;
 const list=await call("list");
 el("results").textContent=JSON.stringify(list,null,2);
 el("login").style.display="none";el("panel").style.display="block";show("");
}
// Email OTP links redirect back as #access_token=...&type=magiclink.
(async()=>{
 const fragment=new URLSearchParams(location.hash.substring(1));
 const access=fragment.get("access_token");
 if(access){history.replaceState(null,"",location.pathname);try{await finishLogin(access)}catch(e){token="";show("Accès administrateur refusé : "+e.message)}}
})();
el("loginBtn").onclick=async()=>{
 try{
 const r=await fetch(origin+"/auth/v1/otp?redirect_to="+encodeURIComponent(location.origin+location.pathname),{method:"POST",headers:{"apikey":apikey,"content-type":"application/json"},body:JSON.stringify({email:el("email").value.trim(),create_user:false})});
 if(!r.ok)throw Error("Envoi impossible : vérifie l’adresse et la configuration Supabase Auth");
 show("Consulte ta messagerie pour ouvrir le lien de connexion.");
 }catch(e){show(e.message)}
};el("logoutBtn").onclick=()=>{token="";el("results").textContent="";el("login").style.display="block";el("panel").style.display="none";show("Déconnecté")};
el("createBtn").onclick=async()=>{try{const j=await call("create",{days:Number(el("days").value),limit:Number(el("limit").value)});show("Code à copier maintenant (affiché une seule fois) : "+j.invitation_code)}catch(e){show(e.message)}};
el("listBtn").onclick=async()=>{try{el("results").textContent=JSON.stringify(await call("list"),null,2);show("")}catch(e){show(e.message)}};
el("revokeBtn").onclick=async()=>{try{await call("revoke",{id:el("revokeId").value.trim()});show("Accès révoqué");el("listBtn").click()}catch(e){show(e.message)}};
</script></body></html>
